{% extends "base.html" %}

{% block titulo %}
Login
{% endblock %}

  {% block conteudo %}
  <div class="container">
    <div class="buttonsForm">
      <div class="btnColor" id="btnColor"></div>
      <button id="btnSignin">Login</button>
      <button id="btnSignup">Cadastro</button>
    </div>

    <!-- Formulário de Login -->
    <form id="signin" method="POST" action="{{url_for('auth.login')}}">
      <div class="inputBox">
        <input type="text" name="email" placeholder="Email" required />
        <i class="fas fa-envelope"></i>
      </div>

      <div class="inputBox">
        <input type="password" name="senha" placeholder="Senha" required />
        <i class="fas fa-lock"></i>
      </div>

      <div class="divCheck">
        <input type="checkbox" />
        <span>Guarde sua senha</span>
      </div>

      <button type="submit">Acessar</button>
    </form>

    <!-- Formulário de Cadastro -->
    <form id="signup" action="{{ url_for('auth.cadastrar') }}" method="POST">
      <div class="inputBox">
        <input type="text" name="nome" placeholder="Nome da empresa" required />
      </div>

      <div class="inputBox">
        <input type="text" name="identificador_url" placeholder="Identificador da URL" required />
      </div>

      <div class="inputBox">
        <input type="text" name="email" placeholder="Email" required />
        <i class="fas fa-envelope"></i>
      </div>

      <div class="inputBox">
        <input type="password" name="senha" placeholder="Senha" required />
        <i class="fas fa-lock"></i>
      </div>

      <div class="inputBox">
        <input type="password" name="senha2" placeholder="Confirme sua senha" required />
        <i class="fas fa-lock"></i>
      </div>

      <div class="divCheck">
        <input type="checkbox" required />
        <span>Aceito os termos</span>
      </div>

      <button type="submit">Cadastrar</button>
    </form>
  </div>
  {% endblock %}
