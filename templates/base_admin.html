<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block titulo %}
        Painel Administrativo
        {% endblock %}
    </title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@300;500;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style_adm.css') }}"
    >

    {% block css %}
    {% endblock %}
</head>

<body>

<div class="page-wrapper">

    <header class="site-header">
        <div class="container header-inner">

            <div class="header-actions">
                <a href="#vendas" class="btn login">
                    Relatórios
                </a>
            </div>

            <div class="header-actions">
                <a
                    href="{{ url_for('loja.loja_publica', identificador=identificador) }}"
                    class="btn login"
                >
                    Página do Cliente
                </a>
            </div>

            <div class="font-controls">
                <button id="fontInc">A+</button>
                <button id="fontDec">A-</button>
            </div>

        </div>
    </header>

    <main class="content-center">
        {% block conteudo %}
        {% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <p>
                © <strong>S.A.N.E</strong>
                — Sistema de Apoio a Negócios e Empresas
            </p>
        </div>
    </footer>

</div>

{% block scripts %}
{% endblock %}

</body>
</html>
